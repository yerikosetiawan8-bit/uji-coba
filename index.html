<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Digital Kafe</title>
    <style>
        /* ==========================================
           VARIABEL TEMA & RESET DASAR
           ========================================== */
        :root {
            --primary-color: #e67e22;      /* Warna aksen utama (Oranye Kafe) */
            --primary-dark: #d35400;       /* Warna saat tombol ditekan */
            --bg-color: #f8f9fa;           /* Warna latar belakang halaman */
            --card-bg: #ffffff;            /* Warna latar belakang kartu menu */
            --text-primary: #2c3e50;       /* Warna teks judul */
            --text-secondary: #666666;     /* Warna deskripsi */
            --border-radius: 12px;         /* Sudut kebulatan elemen */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 480px; /* Lebar maksimal tampilan ponsel */
            margin: 0 auto;
            min-height: 100vh;
        }

        /* ==========================================
           HEADER KAFE
           ========================================== */
        header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* ==========================================
           NAVIGASI KATEGORI (SCROLL HORIZONTAL)
           ========================================== */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            scrollbar-width: none; /* Sembunyikan scrollbar di Firefox */
        }

        .categories::-webkit-scrollbar {
            display: none; /* Sembunyikan scrollbar di Chrome/Safari */
        }

        .category-btn {
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease-in-out;
        }

        .category-btn:active {
            transform: scale(0.95);
        }

        .category-btn.active {
            background-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(230, 126, 34, 0.4);
        }

        /* ==========================================
           DAFTAR KARTU MENU
           ========================================== */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-card {
            display: flex;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .menu-card img {
            width: 95px;
            height: 95px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .menu-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .menu-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .menu-info p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Batasi deskripsi maksimal 2 baris */
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .menu-price {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Bagian Header -->
    <header>
        <h1>☕ Kopi Senja</h1>
        <p>Pindai & Pilih Menu Favoritmu</p>
    </header>

    <!-- Tombol Filter Kategori -->
    <div class="categories">
        <button class="category-btn active" onclick="filterMenu('semua', this)">Semua</button>
        <button class="category-btn" onclick="filterMenu('kopi', this)">Kopi</button>
        <button class="category-btn" onclick="filterMenu('non-kopi', this)">Non-Kopi</button>
        <button class="category-btn" onclick="filterMenu('makanan', this)">Makanan</button>
    </div>

    <!-- Tempat Munculnya Daftar Menu -->
    <div class="menu-list" id="menuContainer"></div>

    <script>
        // ==========================================
        // DATA MENU (Dapat diubah atau ditambah dengan mudah)
        // ==========================================
        const dataMenu = [
            {
                nama: "Kopi Susu Gula Aren",
                kategori: "kopi",
                harga: "Rp 18.000",
                deskripsi: "Espresso khas dengan susu segar dan gula aren asli pilihan.",
                gambar: "https://images.unsplash.com/photo-1541167760496-1628856ab772?w=300"
            },
            {
                nama: "Americano Cold",
                kategori: "kopi",
                harga: "Rp 15.000",
                deskripsi: "Seduhan kopi hitam dingin yang menyegarkan tanpa gula.",
                gambar: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=300"
            },
            {
                nama: "Matcha Latte",
                kategori: "non-kopi",
                harga: "Rp 22.000",
                deskripsi: "Bubuk matcha Jepang premium dipadu dengan susu segar.",
                gambar: "https://images.unsplash.com/photo-1536256263959-770b48d82b0a?w=300"
            },
            {
                nama: "French Fries Classic",
                kategori: "makanan",
                harga: "Rp 14.000",
                deskripsi: "Kentang goreng renyah disajikan dengan saus sambal.",
                gambar: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300"
            }
        ];

        // Fungsi Menampilkan Menu ke Halaman Web
        function tampilkanMenu(items) {
            const container = document.getElementById("menuContainer");
            container.innerHTML = "";

            items.forEach(item => {
                const kartuHTML = `
                    <div class="menu-card">
                        <img src="${item.gambar}" alt="${item.nama}">
                        <div class="menu-info">
                            <h3>${item.nama}</h3>
                            <p>${item.deskripsi}</p>
                            <span class="menu-price">${item.harga}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += kartuHTML;
            });
        }

        // Fungsi untuk Menyaring Menu Berdasarkan Kategori
        function filterMenu(kategori, tombol) {
            // Mengatur kelas aktif pada tombol kategori
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            tombol.classList.add('active');

            // Menampilkan data sesuai pilihan kategori
            if (kategori === 'semua') {
                tampilkanMenu(dataMenu);
            } else {
                const hasilFilter = dataMenu.filter(item => item.kategori === kategori);
                tampilkanMenu(hasilFilter);
            }
        }

        // Panggil fungsi tampilkan menu pertama kali saat halaman dibuka
        tampilkanMenu(dataMenu);
    </script>
</body>
</html>
